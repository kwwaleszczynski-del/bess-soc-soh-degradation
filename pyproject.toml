[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-soc-soh-degradation"
version = "0.1.0"
description = "How a grid battery's operating strategy translates into state of charge, ageing and revenue: SoC reconstruction validated on operator data, rainflow + LFP ageing model fitted to cell data, degradation-aware arbitrage (AEMO, ACEN and Zenodo open data)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "requests>=2.31",
    "openpyxl>=3.1",
    "plotly>=5.20",
    "kaleido>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bess-degradation = "bess_degradation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
